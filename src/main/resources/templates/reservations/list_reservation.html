<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Liste des Réservations</title>
</head>

<body>
    <section>
        <h2>Liste des Réservations</h2>

        <!-- Formulaire de filtrage par date -->
        <div class="filter-section">
            <form method="get" th:action="@{/reservations}" class="filter-form">
                <div class="form-group">
                    <label for="date_reservation">Filtrer par date:</label>
                    <input type="date" id="date_reservation" name="date_reservation" class="form-control"
                        th:value="${param.date_reservation}">
                </div>
                <button type="submit" class="btn btn-primary">Rechercher</button>
                <a th:href="@{/reservations}" class="btn btn-secondary">Réinitialiser</a>
            </form>
        </div>

        <!-- Table des réservations -->
        <div class="table-container">
            <table class="reservation-table">
                <thead>
                    <tr>
                        <th>ID Client</th>
                        <th>Nom Hôtel</th>
                        <th>Nombre de Passagers</th>
                        <th>Date de Réservation</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reservations.isEmpty()}">
                        <td colspan="4" class="no-data">Aucune réservation trouvée</td>
                    </tr>
                    <tr th:each="reservation : ${reservations}">
                        <td th:text="${reservation.id_client}"></td>
                        <td th:text="${reservation.nom_hotel}"></td>
                        <td th:text="${reservation.nb_passager}"></td>
                        <td th:text="${#dates.format(reservation.date_reservation, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="total-count">
            <p>Total: <strong th:text="${reservations.size()}">0</strong> réservation(s)</p>
        </div>
    </section>
</body>

</html>
